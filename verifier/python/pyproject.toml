[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prokura-verify"
version = "0.1.0"
description = "Offline verifier for Prokura Nachweis exports, signed roots and checkpoints, and Merkle inclusion proofs."
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
prokura-verify = "prokura_verify.__main__:main"

[tool.setuptools]
packages = ["prokura_verify"]
