name: ci
on: [push, pull_request]
jobs:
  verifier-typescript:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: verifier/typescript } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  verifier-python:
    runs-on: ubuntu-latest
    strategy: { matrix: { python: ["3.9", "3.12", "3.13"] } }
    defaults: { run: { working-directory: verifier/python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e '.[test]'
      - run: pytest -q
  examples-typecheck:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: examples/typescript } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
